{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block container_class %} narrow{% endblock %}
{% block content %}
<div class="card">
  <h2 class="mt-0">Create your account</h2>
  <form method="POST" novalidate>
    <div class="form-group">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8">
      <div class="hint">Must be at least 8 characters with mixed case (A-Z, a-z) and at least one number (0-9).</div>
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
  </form>
  <p style="text-align:center; margin-top:16px; font-size:0.9rem;">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</div>
{% endblock %}
